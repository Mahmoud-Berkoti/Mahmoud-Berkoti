name: Refresh profile
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile.yml']
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render public repository activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py
      - name: Commit changed cards
        run: |
          git add assets/activity-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public repository statistics'
          git push
